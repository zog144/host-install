name: Task C registry-bound installation storage source admission
on:
  push:
    branches: [regular/task-c-installation-storage-authority-20261107, regular/state-directory-runtime-integration-20261107]
  pull_request:
    paths:
      - src/zog/host_install/graphical_registry_storage_installation.py
      - tests/test_graphical_registry_storage_installation.py
      - .github/workflows/graphical-registry-storage-installation.yml
permissions:
  contents: read
jobs:
  registry-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: d2bcb8002f04a0fae2b0b4bb3b77a782ec049ce7
          path: companions/root-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Exact pinned root source, protected two-mount plan and separate operation claims
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/root-control/src:${{ github.workspace }}/companions/root-control/tests
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = d2bcb8002f04a0fae2b0b4bb3b77a782ec049ce7
          python -m pytest -q -rs \
            tests/test_graphical_registry_storage_installation.py \
            tests/test_graphical_protected_storage_admission.py \
            companions/root-control/tests/test_graphical_installation_storage_authority.py \
            companions/root-control/tests/test_graphical_s3_installation_checkpoint.py \
            companions/root-control/tests/test_graphical_installation_storage_commit.py
      - if: always()
        run: echo 'Source-only registry binding; native mounts, S3 genesis, owner credential and IPC placement remain UNACCEPTED.' >> "$GITHUB_STEP_SUMMARY"
