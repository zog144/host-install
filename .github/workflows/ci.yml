name: Public source validation

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and public consumers (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out host-install
        uses: actions/checkout@v4
      - name: Check out reviewed public host-identify
        uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: companions/host-identify
      - name: Check out reviewed public host-discover
        uses: actions/checkout@v4
        with:
          repository: zog144/host-discover
          ref: 9e741d9a86bb2fd466ac46b252be0b78528eeff7
          path: companions/host-discover
      - name: Check out reviewed public box-control observer
        uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: 8249715708c6ef8a1fd30a3fb529b4034ffffe25
          path: companions/box-control
      - name: Check out reviewed image-build progress producer
        uses: actions/checkout@v4
        with:
          repository: zog144/image-build
          ref: 53ad8c2166e6b73dffbc722c2e47ccf3593612ec
          path: companions/image-build
      - name: Check out reviewed host-welcome consumer
        uses: actions/checkout@v4
        with:
          repository: zog144/host-welcome
          ref: a1d554bb78de27e9f365f4254db25c77cc49ec27
          path: companions/host-welcome
      - name: Check out certificate box-control producer
        uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: 73d64fb8b643e27667ac719080a37913c008b5dd
          path: companions/box-control-certificate
      - name: Check out certificate root-control producer
        uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 8bb9a5638622b3c443e59351cfdf06583cea8e80
          path: companions/root-control
      - name: Check out reviewed unified HTTPS receiver root-control source
        uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: d85aa7feb8a4db28249c5edde958d3d006e5e009
          path: companions/root-control-cross-host
          sparse-checkout: |
            src/zog/root_control/issuer_https_receiver.py
            src/zog/root_control/issuer_receipt_common.py
            src/zog/root_control/issuer_cross_host.py
      - name: Check out canonical station credential v1 interoperability vectors
        uses: actions/checkout@v4
        with:
          repository: zog144/station-access
          ref: 51295bd7a458a621ccbf33eab03da43ba84ce71a
          path: companions/station-access-cross-host
          sparse-checkout: |
            tests/host_registry/fixtures/credential-delivery-v1-vector.json
            verification/credential_v1/test_shared_interop.py
      - name: Check out certify-manage issuer source
        uses: actions/checkout@v4
        with:
          repository: zog144/certify-manage
          ref: 8d073ff449557fc82c12eea93e240cdeec1b0fcc
          path: companions/certify-manage
      - name: Check out reviewed host-deploy certificate authority consumer
        uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 9ed396c08aa5be30bd514630838b8a4baf2e2087
          path: companions/host-deploy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate source and pinned public dependencies
        run: |
          test ! -e COPYRIGHT
          test ! -e version-share-handoff.json
          test ! -e evidence
          test ! -e publication
          test -f LICENSE
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
          test "$(git -C companions/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          test "$(git -C companions/host-discover rev-parse HEAD)" = "9e741d9a86bb2fd466ac46b252be0b78528eeff7"
          test "$(git -C companions/box-control rev-parse HEAD)" = "8249715708c6ef8a1fd30a3fb529b4034ffffe25"
          test "$(git -C companions/image-build rev-parse HEAD)" = "53ad8c2166e6b73dffbc722c2e47ccf3593612ec"
          test "$(git -C companions/host-welcome rev-parse HEAD)" = "a1d554bb78de27e9f365f4254db25c77cc49ec27"
          test "$(git -C companions/box-control-certificate rev-parse HEAD)" = "73d64fb8b643e27667ac719080a37913c008b5dd"
          test "$(git -C companions/root-control rev-parse HEAD)" = "8bb9a5638622b3c443e59351cfdf06583cea8e80"
          test "$(git -C companions/root-control-cross-host rev-parse HEAD)" = "d85aa7feb8a4db28249c5edde958d3d006e5e009"
          test "$(git -C companions/root-control-cross-host hash-object src/zog/root_control/issuer_https_receiver.py)" = "4d3d11a874203336cb5bf386e78af20e6772d21f"
          test "$(git -C companions/root-control-cross-host hash-object src/zog/root_control/issuer_receipt_common.py)" = "4c1fe6b37c95d3cd038aba0c8a0df3b71a55d13f"
          test "$(git -C companions/root-control-cross-host hash-object src/zog/root_control/issuer_cross_host.py)" = "a1631150dd7df2cf10c36c953a9fcd6af9a3847e"
          test "$(git -C companions/station-access-cross-host rev-parse HEAD)" = "51295bd7a458a621ccbf33eab03da43ba84ce71a"
          test "$(git -C companions/host-identify hash-object src/zog/host_identify/credential_delivery.py)" = "02332127defe565e00e398b71ada50d5c2bdd4d6"
          test "$(git -C companions/station-access-cross-host hash-object tests/host_registry/fixtures/credential-delivery-v1-vector.json)" = "227a043ffbf88489d2c8b65790058ef870e5c1bc"
          test "$(git -C companions/station-access-cross-host hash-object verification/credential_v1/test_shared_interop.py)" = "ca1701206507dbaaeccef049c930fac8ef5368f9"
          test "$(git -C companions/certify-manage rev-parse HEAD)" = "8d073ff449557fc82c12eea93e240cdeec1b0fcc"
          test "$(git -C companions/host-deploy rev-parse HEAD)" = "9ed396c08aa5be30bd514630838b8a4baf2e2087"
          test "$(git -C companions/host-deploy hash-object src/zog/host_deploy/certificate_cross_host_admission.py)" = "592983a3d299aaf1228248157fdea3908680f097"
          test "$(git -C companions/host-deploy hash-object src/zog/host_deploy/certificate_cloudflare_https_consumer.py)" = "cf771f8625e329e557939a1f268517c52faaf2de"
      - name: Install reviewed companions and local source
        run: |
          python -m pip install './companions/host-identify' 'pytest>=8,<10'
          python -m pip install --no-deps './companions/host-discover'
          python -m pip install --no-deps './companions/image-build'
          python -m pip install --no-deps './companions/box-control-certificate/box-control'
          python -m pip install --no-deps './companions/host-deploy'
          python -m pip install --no-deps .
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Run ownership-accurate synthetic and companion tests
        env:
          HOST_IDENTIFY_SOURCE: companions/host-identify
          HOST_DISCOVER_SOURCE: companions/host-discover
          BOX_CONTROL_SOURCE: companions/box-control
          IMAGE_BUILD_SOURCE: companions/image-build
          CERTIFICATE_BOX_CONTROL_SOURCE: companions/box-control-certificate
          ROOT_CONTROL_SOURCE: companions/root-control
          ROOT_CONTROL_CROSS_HOST_SOURCE: companions/root-control-cross-host
          STATION_ACCESS_CROSS_HOST_SOURCE: companions/station-access-cross-host
          CERTIFY_MANAGE_SOURCE: companions/certify-manage
          HOST_DEPLOY_SOURCE: companions/host-deploy
        run: |
          # STATE coordination tests require real root ownership; no mocked UID.
          # The GitHub-hosted runner is disposable, not an enrolled Zog host.
          sudo --preserve-env=HOST_IDENTIFY_SOURCE,HOST_DISCOVER_SOURCE,BOX_CONTROL_SOURCE,IMAGE_BUILD_SOURCE,CERTIFICATE_BOX_CONTROL_SOURCE,ROOT_CONTROL_SOURCE,ROOT_CONTROL_CROSS_HOST_SOURCE,STATION_ACCESS_CROSS_HOST_SOURCE,CERTIFY_MANAGE_SOURCE,HOST_DEPLOY_SOURCE "$(command -v python)" -m pytest -q tests
      - name: Confirm CLI and namespace
        run: |
          host-install --help >/dev/null
          python -c 'import zog.host_install as h; assert h.__version__ == "0.14.9"'
          test ! -e src/zog/__init__.py

  host-discover-compatibility:
    name: host-discover 0.4.11 / host-install 0.14 compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out host-install
        uses: actions/checkout@v4
      - name: Check out selected host-discover public source
        uses: actions/checkout@v4
        with:
          repository: zog144/host-discover
          ref: 9e741d9a86bb2fd466ac46b252be0b78528eeff7
          path: companions/host-discover-compat
      - name: Check out reviewed host-identify companion
        uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 1a5eac0b255c995022db6a3a4c0051efffa748cc
          path: companions/host-identify-compat
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact compatibility inputs
        run: |
          test "$(git -C companions/host-discover-compat rev-parse HEAD)" = "9e741d9a86bb2fd466ac46b252be0b78528eeff7"
          test "$(git -C companions/host-identify-compat rev-parse HEAD)" = "1a5eac0b255c995022db6a3a4c0051efffa748cc"
          grep -F '"host-install==0.14.3"' companions/host-discover-compat/pyproject.toml
          grep -F '__version__ = "0.4.11"' companions/host-discover-compat/src/zog/host_discover/__init__.py
          test ! -e src/zog/__init__.py
      - name: Install exact source pair without stale standalone dependency resolution
        run: |
          python -m pip install './companions/host-identify-compat' 'pytest>=8,<10'
          python -m pip install --no-deps .
          python -m pip install --no-deps './companions/host-discover-compat'
      - name: Compile selected host-discover source and tests
        run: |
          python -m compileall -q companions/host-discover-compat/src companions/host-discover-compat/tests
      - name: Run host-install 0.14 successor compatibility suite
        working-directory: companions/host-discover-compat
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_network_retry.py \
            --ignore=tests/test_session_recovery.py \
            --ignore=tests/test_supervised_beacon.py \
            --ignore=tests/test_host_install_014_compatibility.py \
            --ignore=tests/test_host_install_native_compatibility.py
          python -m pytest -q tests/test_host_install_014_compatibility.py \
            -k 'not selected_host_install_version_is_exact'
          sudo --preserve-env=PATH "$(command -v python)" -m pytest -q \
            tests/test_network_retry.py \
            tests/test_session_recovery.py \
            tests/test_supervised_beacon.py \
            tests/test_host_install_native_compatibility.py

  artifacts:
    name: Wheel and source distribution audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Inspect public distribution
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels = glob.glob('dist/*.whl')
          sdists = glob.glob('dist/*.tar.gz')
          assert len(wheels) == len(sdists) == 1
          with zipfile.ZipFile(wheels[0]) as z:
              members = set(z.namelist())
              assert 'zog/host_install/__init__.py' in members
              assert 'zog/host_install/state_admission.py' in members
              assert 'zog/host_install/certificate_gate.py' in members
              assert 'zog/host_install/certificate_lifecycle.py' in members
              assert 'zog/host_install/issuer_cross_host_adoption.py' in members
              assert 'zog/host_install/welcome_readiness.py' in members
              assert 'zog/host_install/application_progress_profile.py' in members
              assert 'zog/host_install/host_welcome_progress_profile.py' in members
              assert 'zog/host_install/image_progress_profile.py' in members
              assert 'zog/host_install/certify_manage_profile.py' in members
              assert 'zog/host_install/certificate_native_observation.py' in members
              assert 'zog/host_install/bootable_image_contract.py' in members
              assert 'zog/host_install/systemd/host-install-admission.socket' in members
              assert 'zog/host_install/systemd/host-install-welcome.socket' in members
              assert 'zog/host_install/systemd/host-install-welcome@.service' in members
              assert 'zog/host_install/systemd/zog-application-progress.socket.in' in members
              assert 'zog/host_install/systemd/zog-application-progress.service.in' in members
              assert 'zog/host_install/systemd/zog-host-welcome-controller-progress.socket.in' in members
              assert 'zog/host_install/systemd/zog-host-welcome-controller-progress.service.in' in members
              assert 'zog/host_install/systemd/zog-host-welcome-image-progress.socket.in' in members
              assert 'zog/host_install/systemd/zog-host-welcome-image-progress.service.in' in members
              assert 'zog/host_install/systemd/zog-host-welcome-image-progress-certify-manage.service.in' in members
              assert 'zog/__init__.py' not in members
              assert not any(x.startswith('tests/') or x.startswith('evidence/') for x in members)
              assert any(x.endswith('/LICENSE') for x in members)
              entry = next(x for x in members if x.endswith('.dist-info/entry_points.txt'))
              assert 'host-install = zog.host_install.cli:main' in z.read(entry).decode()
          with tarfile.open(sdists[0], 'r:gz') as t:
              names = t.getnames()
              prefix = names[0].split('/', 1)[0]
              files = {x[len(prefix)+1:] for x in names if x.startswith(prefix + '/')}
              for p in ('LICENSE', 'LICENSES/BSD-3-Clause.txt',
                        'LICENSES/GPL-3.0-only.txt', 'THIRD-PARTY-NOTICES.md',
                        'README.md', 'docs/host-install/README.md',
                        'examples/state-contract-v1/bundle.json',
                        'tests/test_namespace_migration.py',
                        'src/zog/host_install/state_contract.py',
                        'src/zog/host_install/certificate_lifecycle.py',
                        'tests/test_certificate_lifecycle.py',
                        'src/zog/host_install/certificate_owner_authority.py',
                        'src/zog/host_install/issuer_cross_host_adoption.py',
                        'tests/test_issuer_cross_host_adoption.py',
                        'tests/test_certificate_owner_authority.py',
                        'src/zog/host_install/welcome_readiness.py',
                        'tests/test_welcome_readiness.py',
                        'tests/test_welcome_units.py',
                        'examples/welcome-bootstrap-v1/scenarios.json',
                        'src/zog/host_install/application_progress_profile.py',
                        'tests/test_application_progress_profile.py',
                        'examples/systemd/zog-application-progress.socket.in',
                        'examples/systemd/zog-application-progress.service.in',
                        'src/zog/host_install/host_welcome_progress_profile.py',
                        'tests/test_host_welcome_progress_profile.py',
                        'tests/test_host_discover_compatibility.py',
                        'docs/host-install/host-discover-compatibility-2026-10-24.md',
                        'docs/host-install/host-discover-compatibility-2026-10-18.md',
                        'examples/systemd/zog-host-welcome-controller-progress.socket.in',
                        'examples/systemd/zog-host-welcome-controller-progress.service.in',
                        'src/zog/host_install/image_progress_profile.py',
                        'tests/test_image_progress_profile.py',
                        'docs/host-install/image-build-progress-observer.md',
                        'examples/systemd/zog-host-welcome-image-progress.socket.in',
                        'examples/systemd/zog-host-welcome-image-progress.service.in',
                        'examples/systemd/zog-host-welcome-image-progress-certify-manage.service.in',
                        'src/zog/host_install/systemd/zog-host-welcome-image-progress-certify-manage.service.in',
                        'src/zog/host_install/certify_manage_profile.py',
                        'tests/test_certify_manage_profile.py',
                        'docs/host-install/certify-manage-native-install.md',
                        'docs/host-install/certificate-owner-authority.md',
                        'src/zog/host_install/certificate_native_observation.py',
                        'tests/test_certificate_native_observation.py',
                        'src/zog/host_install/bootable_image_contract.py',
                        'tests/test_bootable_image_contract.py',
                        'docs/host-install/bootable-image-contract.md'):
                  assert p in files, p
              assert not any(x.startswith('evidence/') for x in files)
              assert 'COPYRIGHT' not in files
              assert 'version-share-handoff.json' not in files
          PY
