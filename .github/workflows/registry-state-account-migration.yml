name: Registry directory STATE account migration source and rollback
on:
  push:
    branches: [regular/registry-directory-state-account-migration-20261108]
  pull_request:
    paths:
      - src/zog/host_install/state_account_migration.py
      - src/zog/host_install/state_account_migration_consumer.py
      - src/zog/host_install/state_account_migration_completion.py
      - src/zog/host_install/state_account_migration_native.py
      - tests/test_state_account_migration.py
      - tests/test_state_account_migration_completion.py
      - tests/test_state_account_migration_native.py
      - src/zog/host_install/state_account_migration_storage.py
      - src/zog/host_install/state_account_migration_launcher.py
      - src/zog/host_install/state_account_migration_observer.py
      - tests/test_state_account_migration_observer.py
      - tests/test_state_account_migration_launcher.py
      - src/zog/host_install/state_provision.py
      - tests/test_state_account_migration_storage.py
      - .github/workflows/registry-state-account-migration.yml
permissions:
  contents: read
jobs:
  source-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 39972469ec01017f83dea488ca5b868d9d691062
          path: companions/host-identify
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-discover
          ref: 99965cf6d66f68c92affbedf585bf7b366f4d095
          path: companions/host-discover
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'http-message-signatures>=2.0.1,<3' 'requests>=2.32,<3' 'PyJWT>=2.10,<3' 'typing_extensions>=4.12'
      - name: Check exact companion revisions and migration candidate
        run: |
          test "$(git -C companions/host-identify rev-parse HEAD)" = 39972469ec01017f83dea488ca5b868d9d691062
          test "$(git -C companions/host-discover rev-parse HEAD)" = 99965cf6d66f68c92affbedf585bf7b366f4d095
      - name: Test recorded migration and all disposable recovery barriers
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-identify/src:${{ github.workspace }}/companions/host-discover/src
        run: |
          python -m pytest -q -rs tests/test_state_account_migration.py tests/test_state_directory_runtime.py -k 'not root_capable'
      - name: Privileged disposable completion and actual retained identity loader
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-identify/src:${{ github.workspace }}/companions/host-discover/src
        run: |
          sudo --preserve-env=PYTHONPATH "${{ env.pythonLocation }}/bin/python" -m pytest -q -rs \
            tests/test_state_account_migration_completion.py \
            tests/test_state_account_migration_native.py \
            tests/test_state_account_migration_storage.py \
            tests/test_state_account_migration_launcher.py \
            tests/test_state_account_migration_observer.py
      - name: Exact companion source consumer regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/host-identify/src:${{ github.workspace }}/companions/host-identify/tests:${{ github.workspace }}/companions/host-discover/src:${{ github.workspace }}/companions/host-discover/tests
        run: |
          sudo --preserve-env=PYTHONPATH "${{ env.pythonLocation }}/bin/python" -m pytest -q -rs \
            companions/host-identify/tests/test_retained_legacy.py \
            companions/host-discover/tests/test_retained_legacy_migration.py
      - if: always()
        run: |
          echo 'Source and disposable root-capable tests only. No live Host, /state, account database, IAM, SSM, beacon, or Task C service was modified. Production migration entrypoint remains disabled.' >> "$GITHUB_STEP_SUMMARY"
