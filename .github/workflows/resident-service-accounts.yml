name: Offline resident system service account materialization
on:
  push:
    branches: [regular/resident-boot-accounts-materialization-20261115]
  pull_request:
    paths:
      - "src/zog/host_install/resident_accounts.py"
      - "tests/test_resident_accounts.py"
      - "pyproject.toml"
      - "docs/host-install/resident-service-accounts-2026-11-15.md"
      - ".github/workflows/resident-service-accounts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-root:
    name: Sysusers staged-root acceptance / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . 'pytest>=8,<10'
      - name: Verify real systemd-sysusers on a disposable unpublished Zog root
        run: |
          command -v systemd-sysusers
          python -m pytest -q -rs tests/test_resident_accounts.py
          python -m pytest -q -rs \
            tests/test_first_boot_a_plan.py \
            tests/test_successor_boot_a_plan.py \
            tests/test_bootable_image_contract.py
      - name: Wheel and CLI packaging
        run: |
          host-install-resident-accounts --help
          python -m pip wheel --no-deps . -w /tmp
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels=list(Path("/tmp").glob("host_install-*.whl"))
          assert len(wheels)==1, wheels
          with ZipFile(wheels[0]) as archive:
              names=set(archive.namelist())
              assert "zog/host_install/resident_accounts.py" in names
              assert "zog/host_install/successor_boot_a_plan.py" in names
              entry=next(x for x in names if x.endswith(".dist-info/entry_points.txt"))
              assert "host-install-resident-accounts =" in archive.read(entry).decode()
          PY
      - name: Source-only acceptance
        run: |
          echo "Only throwaway rootfs directories were written; no live NSS users, published generations, AWS/EC2, disk partitions or boot entry changed." >> "$GITHUB_STEP_SUMMARY"
          echo "image-build Work must execute the offline account materializer before immutable rootfs generation inventory, hashing and publication." >> "$GITHUB_STEP_SUMMARY"
