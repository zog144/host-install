name: Administrator HTTPS v1 receiver source interop

on:
  pull_request:
    branches: [main, unstable]
  push:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  administrator-receiver:
    name: Administrator receiver v1 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: companion/host-identify
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact shared-v1 source
        run: |
          test "$(git -C companion/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          grep -F 'AUTHORIZATION_SCHEMA = "zog-credential-authorization-v1"' companion/host-identify/src/zog/host_identify/credential_delivery.py
      - name: Install only exact selected common protocol and host-install source
        run: |
          python -m pip install './companion/host-identify' 'pytest>=8,<10'
          python -m pip install --no-deps .
      - name: Test signed v1 receiver and negative cases
        run: |
          python -m compileall -q src/zog/host_install/administrator_password_receiver.py tests/test_administrator_password_receiver.py
          python -m pytest -q tests/test_administrator_password_receiver.py -rs
