name: Graphical owner native-install source admission
on:
  push:
    branches: [review/graphical-owner-native-install-source-20261104]
  pull_request:
    paths:
      - src/zog/host_install/graphical_owner_install_admission.py
      - tests/test_graphical_owner_install_admission.py
      - .github/workflows/graphical-owner-native-install-source.yml
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Disabled install source
        env:
          PYTHONPATH: src
        run: |
          test "$(id -u)" -ne 0
          python -m pytest -q tests/test_graphical_owner_install_admission.py
