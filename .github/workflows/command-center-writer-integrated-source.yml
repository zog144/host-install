name: Integrated original Command-Center writer and staged-directory entry source
on:
  push:
    branches:
      - review/command-center-writer-integrated-20261103
  pull_request:
    paths:
      - src/zog/host_install/command_center_authority.py
      - tests/test_command_center_authority.py
      - tests/test_command_center_authority_readback_regression.py
      - .github/workflows/command-center-writer-integrated-source.yml
permissions:
  contents: read
jobs:
  original-writer-and-child:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce single correct PR20 lineage and forbid superseded PR19 head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 5f7d690933a6354087eebde60d3d79212ef979bf HEAD
          git merge-base --is-ancestor 19ad364313dca2dee79e39ad247dd9a784b3dc23 HEAD
          git cat-file -e e6341e37cd8209998986bf89effc97f865f1d266^{commit}
          if git merge-base --is-ancestor e6341e37cd8209998986bf89effc97f865f1d266 HEAD; then
            echo 'ERROR: superseded PR19 has become the selected ancestor' >&2
            exit 1
          fi
          git diff --exit-code 19ad364313dca2dee79e39ad247dd9a784b3dc23 HEAD -- src/zog/host_install/state_io.py pyproject.toml
          grep -q 'single proposed combined descendant' docs/host-install/COMMAND-CENTER-WRITER-INTEGRATED-2026-11-03.md || grep -q 'only proposed combined descendant' docs/host-install/COMMAND-CENTER-WRITER-INTEGRATED-2026-11-03.md
          grep -q 'not an alternative acceptable standalone final head' docs/host-install/COMMAND-CENTER-WRITER-INTEGRATED-2026-11-03.md
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install synthetic source test requirements
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49'
      - name: Regress writer directory, lock and marker identity as an unprivileged user
        run: |
          PYTHONPATH="$PWD/src" python -m pytest -q -rs tests/test_command_center_authority.py -k 'writer_first_bootstrap or interrupted_first_lock_provisioning or vanished_or_substituted_protected_lock or competing_writers or renamed_protected_root or durable_marker_entry or missing_marker_after'
      - name: Test synthetic real root-owned stage, readback, crash and no-replacement recovery
        run: |
          sudo -E env PYTHONPATH="$PWD/src" "$(command -v python)" -m pytest -q -rs tests/test_command_center_authority.py tests/test_command_center_authority_readback_regression.py
      - name: Source-only boundary
        if: always()
        run: |
          echo 'Source-only protected owner and directory-entry review in temporary synthetic directories.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Command-Center STATE, real authority identity, original keys, station database or native installation changed.' >> "$GITHUB_STEP_SUMMARY"
