name: Task C ordinary local installation source (no S3)
on:
  pull_request:
    paths:
      - "src/zog/host_install/task_c_local_install.py"
      - "src/zog/host_install/systemd/task-c-local/**"
      - "tests/test_task_c_local_install.py"
      - "pyproject.toml"
      - ".github/workflows/task-c-local-install.yml"
  workflow_dispatch:

jobs:
  stage-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install normal component development package and pytest
        run: python -m pip install -e . pytest
      - name: Source-only disposable staging and nonactivation regressions
        run: python -m pytest -q tests/test_task_c_local_install.py
      - name: Verify installable Python CLI
        run: |
          host-install-task-c --help
          python -m compileall -q src/zog/host_install/task_c_local_install.py
      - name: Verify all four disabled systemd templates are in ordinary wheel
        run: |
          mkdir -p /tmp/task-c-wheel
          python -m pip wheel --no-deps . -w /tmp/task-c-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels=list(Path('/tmp/task-c-wheel').glob('host_install-*.whl'))
          assert len(wheels)==1, wheels
          with ZipFile(wheels[0]) as z:
              files=set(z.namelist())
          expected={
              'zog/host_install/systemd/task-c-local/zog-task-c-owner.service',
              'zog/host_install/systemd/task-c-local/zog-task-c-owner.socket',
              'zog/host_install/systemd/task-c-local/zog-task-c-trust.service',
              'zog/host_install/systemd/task-c-local/zog-task-c-trust.socket',
          }
          assert expected <= files, expected - files
          PY
      - name: Scope statement
        run: |
          echo "Source-only: neither production Host installation nor systemd socket/service activation nor AWS/SSM was executed." >> "$GITHUB_STEP_SUMMARY"
          echo "S3, approval-signing and installer-signing are not prerequisites for this newly selected ordinary installation path." >> "$GITHUB_STEP_SUMMARY"
