name: Task C direct trusted Host three-owner source contract
on:
  push:
    branches: [regular/state-directory-runtime-integration-20261107]
  pull_request:
    paths:
      - src/zog/host_install/task_c_local_install.py
      - src/zog/host_install/systemd/task-c-local/**
      - tests/test_task_c_local_install.py
      - .github/workflows/task-c-trusted-three-owner.yml
permissions:
  contents: read
jobs:
  direct-ssm-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 6a545931a79e3f700dbf769b8a87fe33f9a6e620
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: bdd4db20fb6f39169718d377907b3958366095f8
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'cryptography>=44,<49'
      - name: Exact selected local owner/gateway/installer source tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/companions/root-control/src:${{ github.workspace }}/companions/host-deploy/src:${{ github.workspace }}/companions/host-deploy/tests
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = 6a545931a79e3f700dbf769b8a87fe33f9a6e620
          test "$(git -C companions/host-deploy rev-parse HEAD)" = bdd4db20fb6f39169718d377907b3958366095f8
          python - <<'PY'
          import importlib
          from zog.host_install import task_c_local_install as installer
          for name in installer.MODULES:
              importlib.import_module(name)
          assert installer.UNITS == ("zog-task-c-gateway.service",)
          assert installer.DATA_DIRS == ("/var/lib/host-deploy-gateway",)
          assert "trust" not in str(installer.UNITS)
          assert "owner" not in str(installer.UNITS)
          PY
          python -m pytest -q -rs \
            tests/test_task_c_local_install.py \
            companions/host-deploy/tests/test_gateway_generic_pipeline.py \
            companions/host-deploy/tests/test_gateway_trusted_host_ssm.py
      - if: always()
        run: |
          echo 'Source-only: direct existing Host role, root-backed local intent, one disabled gateway unit; no S3, signer, EBS, broker, native SSM or Fonts dispatch.' >> "$GITHUB_STEP_SUMMARY"
