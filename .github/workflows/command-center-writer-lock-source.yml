name: Command-Center protected offline writer lock identity source review
on:
  push:
    branches: [review/command-center-stable-writer-lock-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source test prerequisites
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49'
      - name: Exercise unprivileged protected lock identity and interruption tests
        run: PYTHONPATH="$PWD/src" python -m pytest -q -rs tests/test_command_center_authority.py
      - name: Exercise actual root-owned offline stage and receipt inspection in ephemeral directories
        run: |
          sudo -E env PYTHONPATH="$PWD/src" "$(command -v python)" -m pytest -q -rs tests/test_command_center_authority.py
      - name: No native authority installation
        if: always()
        run: |
          echo 'Synthetic root-owned temporary directories only; no /opt/station-trust, STATE, station service, or live signing keys were modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The stable writer lock and inode marker require separately authenticated protected native bootstrap.' >> "$GITHUB_STEP_SUMMARY"
