name: Installed host-discover NSS admission regression
on:
  push:
    branches: [regular/installed-host-discover-nss-admission-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nss-admission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 3fd8bd0bf6ae53a2b9f9214b2eac7f2eb2a492f9
          path: dependencies/host-identify
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install -e dependencies/host-identify
          python -m pip install -e . 'pytest>=8,<10'
      - run: python -m pip check
      - name: Installed account and protected AF_UNIX admission regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: python -m pytest -q -ra tests/test_state_admission.py tests/test_admission_listener.py
      - if: always()
        run: echo 'Synthetic NSS and local socket testing only; no live Host account, service, STATE, key, or socket modified.' >> "$GITHUB_STEP_SUMMARY"
