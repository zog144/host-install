name: Archive provider receiver interface source model
on:
  push:
    branches: [regular/archive-provider-receiver-interface-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-provider-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_archive_provider_receiver_contract.py
      - name: No authority installation
        if: always()
        run: echo 'Source-only, disabled receiver contract model. No network, credential, archive data or native installation.' >> "$GITHUB_STEP_SUMMARY"
