name: Administrator HTTPS v1 source-only receiver contract

on:
  pull_request:
    branches: [review/cross-host-issuer-receiver-adoption-20261028, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-password-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: companions/host-identify
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical v1 exact source and install only reviewed dependencies
        run: |
          test "$(git -C companions/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          test "$(git -C companions/host-identify hash-object src/zog/host_identify/credential_delivery.py)" = "02332127defe565e00e398b71ada50d5c2bdd4d6"
          python -m pip install './companions/host-identify' 'pytest>=8,<10'
          python -m pip install --no-deps .
      - name: Run synthetic administrator password host-commit contract
        run: |
          python -m pytest -q tests/test_station_admin_password_receipt.py
          python -m compileall -q src/zog/host_install/station_admin_password_receipt.py
