name: Selected issuer shared execution epoch source integration
on:
  push:
    branches: [regular/issuer-execution-epoch-integration-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 98da48c7dc897ba12ef609832a48d702c01bd948
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: baca7f815974dbf685950c0c7e78f693dd0a96e2
          path: companions/box-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: e1e0ec43b3aa3b56d4627ff8ed8d24eb2495871a
          path: companions/host-deploy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: historical-zog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Enforce candidate exact heads
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = "98da48c7dc897ba12ef609832a48d702c01bd948"
          test "$(git -C companions/box-control rev-parse HEAD)" = "baca7f815974dbf685950c0c7e78f693dd0a96e2"
          test "$(git -C companions/host-deploy rev-parse HEAD)" = "e1e0ec43b3aa3b56d4627ff8ed8d24eb2495871a"
          test "$(git -C historical-zog rev-parse HEAD)" = "d47d86b363824c718d9c165124cb55bbed12e0f9"
          python - <<'PY'
          from pathlib import Path
          text=Path('src/zog/host_install/certificate_selected_broker_install.py').read_text()
          assert 'BOX_CONTROL_REVIEWED_COMMIT = "baca7f815974dbf685950c0c7e78f693dd0a96e2"' in text
          assert 'ROOT_CONTROL_EXECUTION_REVIEWED_COMMIT = "98da48c7dc897ba12ef609832a48d702c01bd948"' in text
          PY
      - name: Overlay only unrelated historical support into namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("historical-zog/src/zog").resolve()
          target = Path(".ci-deps/zog")
          target.mkdir(parents=True,exist_ok=True)
          for part in source.iterdir():
              if part.name in {"__init__.py","__pycache__","box_control",
                               "root_control","host_install","host_deploy"}:
                  continue
              if part.is_dir() or (part.is_file() and part.suffix==".py"):
                  (target / part.name).symlink_to(part)
          assert not (target / "__init__.py").exists()
          PY
      - name: Re-run installer planning and commit consumer baseline
        run: |
          python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3' 'cryptography>=42,<47'
          PYTHONPATH="$PWD/src:$PWD/companions/root-control/src:$PWD/companions/box-control/box-control/src:$PWD/companions/host-deploy/src:$PWD/.ci-deps:$PWD/tests" \
            python -m pytest -q -rs \
            tests/test_certificate_selected_broker_install.py \
            tests/test_certificate_selected_broker_interop.py \
            tests/test_certificate_execution_commit_interop.py
      - name: Test root-owned concurrent selected admission and revocation
        run: |
          python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3' 'cryptography>=42,<47'
          PYTHONPATH="$PWD/src:$PWD/companions/root-control/src:$PWD/companions/box-control/box-control/src:$PWD/companions/host-deploy/src:$PWD/.ci-deps:$PWD/tests" \
            python -m compileall -q src companions/root-control/src/zog/root_control/issuer_execution_fence.py tests/test_certificate_execution_epoch_integration.py \
            tests/test_certificate_execution_commit_interop.py
          sudo -E env PYTHONPATH="$PWD/src:$PWD/companions/root-control/src:$PWD/companions/box-control/box-control/src:$PWD/companions/host-deploy/src:$PWD/.ci-deps:$PWD/tests" \
            "$(command -v python)" -m pytest -q -rs tests/test_certificate_execution_epoch_integration.py tests/test_certificate_execution_provenance.py tests/test_certificate_recovery_revocation.py
      - name: Native authorization remains withheld
        if: always()
        run: |
          echo 'SOURCE ONLY: no protected installed wheel, root broker socket, real PID1, Certbot, Host reboot or public TLS acceptance' >> "$GITHUB_STEP_SUMMARY"
