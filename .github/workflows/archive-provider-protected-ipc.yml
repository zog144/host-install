name: Archive-provider protected Unix IPC source-only security gate
on:
  push:
    branches: [review/archive-provider-protected-ipc-20261103]
  pull_request:
    paths:
      - src/zog/host_install/archive_provider_protected_ipc.py
      - tests/test_archive_provider_protected_ipc.py
      - .github/workflows/archive-provider-protected-ipc.yml
permissions:
  contents: read
jobs:
  protected-ipc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic source test dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<49'
      - name: Linux AF_UNIX SO_PEERCRED SCM_RIGHTS memfd sealing and signed ACK
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q -rs tests/test_archive_provider_protected_ipc.py
      - name: Native transport remains disabled
        if: always()
        run: echo 'No actual receiver, real credential, privileged peer/UID, STATE installation, provider or transport activated. Synthetic sealed memfd only.' >> "$GITHUB_STEP_SUMMARY"
